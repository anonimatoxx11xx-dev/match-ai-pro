name: Update Match AI Pro football feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_feed.py"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: match-ai-pro-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update today's feed
        run: python3 scripts/update_feed.py
      - name: Commit changed feed
        run: |
          git config user.name "match-ai-pro-feed"
          git config user.email "actions@users.noreply.github.com"
          git add data/today.json
          if git diff --cached --quiet; then
            echo "Feed unchanged."
            exit 0
          fi
          git commit -m "chore(feed): update football data [feed]"
          git push
