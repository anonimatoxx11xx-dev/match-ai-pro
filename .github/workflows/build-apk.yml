name: Build Match AI Pro APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
concurrency:
  group: match-ai-pro-build-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true
      - name: Create Android host
        run: flutter create --platforms=android --project-name match_ai_pro --org com.matchaipro .
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - name: Configure Android network permissions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          permissions = (
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
          )

          if "android.permission.INTERNET" not in text:
              first_end = text.find(">")
              if first_end < 0:
                  raise SystemExit("AndroidManifest.xml: manifest tag not found")
              text = text[:first_end + 1] + "\n" + permissions + text[first_end + 1:]

          path.write_text(text, encoding="utf-8")
          print("Android network permissions configured.")
          PY

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Verify football API secrets
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALDATA_KEY: ${{ secrets.API_FOOTBALDATA_KEY }}
          APP_RAPIDAPI_KEY: ${{ secrets.APP_RAPIDAPI_KEY }}
        run: |
          configured=0
          for name in API_FOOTBALL_KEY API_FOOTBALDATA_KEY APP_RAPIDAPI_KEY; do
            value="$(printenv "$name")"
            if [ -n "$value" ]; then
              echo "$name is configured."
              configured=$((configured + 1))
            else
              echo "$name is not configured."
            fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "No football API secret is configured."
            exit 1
          fi
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_FOOTBALL_KEY="${{ secrets.API_FOOTBALL_KEY }}" \
            --dart-define=API_FOOTBALDATA_KEY="${{ secrets.API_FOOTBALDATA_KEY }}" \
            --dart-define=APP_RAPIDAPI_KEY="${{ secrets.APP_RAPIDAPI_KEY }}"
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MatchAIPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MatchAIPro-APK
          path: build/app/outputs/flutter-apk/MatchAIPro.apk
