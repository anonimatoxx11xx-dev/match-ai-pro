name: Build Match AI Pro APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true
      - name: Create Android host
        run: flutter create --platforms=android --project-name match_ai_pro --org com.matchaipro .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MatchAIPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MatchAIPro-APK
          path: build/app/outputs/flutter-apk/MatchAIPro.apk
