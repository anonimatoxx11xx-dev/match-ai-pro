                      status_raw = str(match.get("status") or "").lower()
                      status = "LIVE" if any(x in status_raw for x in ("live", "progress", "playing")) else ("FT" if any(x in status_raw for x in ("complete", "finished", "final")) else "NS")
                      score = match.get("score") or {}
                      sh = as_int(score.get("home"))
                      sa = as_int(score.get("away"))
