          def load_thesportsdb():
              url = f"https://www.thesportsdb.com/api/v1/json/123/eventsday.php?d={ISO_DATE}&s=Soccer"
              try:
                  data = get_json(url, 20)
                  events = data.get("events") or []
                  out = []
                  for event in events:
                      date_value = event.get("dateEvent") or ISO_DATE
                      time_value = event.get("strTime") or event.get("strEventTime")
                      timestamp = parse_provider_timestamp(date_value, time_value)
                      status_raw = str(event.get("strStatus") or "").lower()
                      progress = str(event.get("strProgress") or "").lower()
                      finished = any(x in status_raw for x in ("ft", "finished", "final")) or "final" in progress
                      live = any(x in status_raw for x in ("live", "1h", "2h", "ht", "extra")) or ("-" in progress and ":" in progress)
                      status = "LIVE" if live and not finished else ("FT" if finished else "NS")
                      sh = as_int(event.get("intHomeScore"))
                      sa = as_int(event.get("intAwayScore"))
                      out.append(external_record(
                          "TheSportsDB",
                          event.get("idEvent"),
                          event.get("strHomeTeam"),
                          event.get("strAwayTeam"),
                          event.get("strLeague") or "Soccer",
                          timestamp,
                          status,
                          None if status == "NS" else sh,
                          None if status == "NS" else sa,
                      ))
