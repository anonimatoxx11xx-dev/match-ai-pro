name: Update football feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

concurrency:
  group: match-ai-pro-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FotMob feed
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Zurich")
          now = datetime.now(tz)
          date = now.strftime("%Y%m%d")
          iso_date = now.date().isoformat()

          url = f"https://www.fotmob.com/api/data/matches?date={date}&timezone=Europe%2FZurich&ccode3=ITA"
          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 14) MatchAIPro/1.0",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
          }

          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload = json.loads(r.read().decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"FotMob feed failed: {exc}")

          def as_int(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  return int(value)
              if isinstance(value, str):
                  try:
                      return int(float(value.replace("%", "").strip()))
                  except ValueError:
                      return None
              return None

          def iter_stat_entries(node):
              """
              FotMob groups match stats in nested sections such as:
              Top stats -> stats -> [ {title, stats:[home,away]}, ... ].
              Walk every nested list/dict so the parser keeps working if
              FotMob adds another grouping layer.
              """
              if isinstance(node, dict):
                  title = node.get("title")
                  values = node.get("stats")
                  if title is not None and isinstance(values, list) and len(values) >= 2:
                      yield node
                  for value in node.values():
                      yield from iter_stat_entries(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from iter_stat_entries(value)

          def pick(block, titles):
              wanted = [x.lower() for x in titles]
              for item in iter_stat_entries(block):
                  title = str(item.get("title") or "").strip().lower()
                  if not any(w == title or w in title for w in wanted):
                      continue
                  values = item.get("stats")
                  if not isinstance(values, list) or len(values) < 2:
                      continue
                  h, a = as_int(values[0]), as_int(values[1])
                  if h is not None and a is not None:
                      return h, a
              return 0, 0

          def fetch_stats(match_id):
              detail_url = f"https://www.fotmob.com/api/data/matchDetails?matchId={match_id}"
              try:
                  req = urllib.request.Request(detail_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = json.loads(r.read().decode("utf-8"))
                  content = body.get("content") or {}
                  periods = content.get("stats", {}).get("Periods", {})
                  all_stats = periods.get("All", {}) if isinstance(periods, dict) else {}
                  items = all_stats.get("stats", []) if isinstance(all_stats, dict) else []
                  if not isinstance(items, list):
                      return {}
                  shots = pick(items, ["total shots", "shots"])
                  on = pick(items, ["shots on target", "shots on goal"])
                  corners = pick(items, ["corners"])
                  fouls = pick(items, ["fouls"])
                  yellow = pick(items, ["yellow cards"])
                  red = pick(items, ["red cards"])
                  throwins = pick(items, ["throw-ins", "throw ins"])
                  saves = pick(items, ["saves", "goalkeeper saves"])
                  return {
                      "homeShots": shots[0], "awayShots": shots[1],
                      "homeOn": on[0], "awayOn": on[1],
                      "homeCorners": corners[0], "awayCorners": corners[1],
                      "homeFouls": fouls[0], "awayFouls": fouls[1],
                      "homeCards": yellow[0] + red[0], "awayCards": yellow[1] + red[1],
                      "homeThrow": throwins[0], "awayThrow": throwins[1],
                      "homeSaves": saves[0], "awaySaves": saves[1],
                  }
              except Exception:
                  return {}

          records = []

          def collect_match_pairs(node, inherited_league="Football", inherited_ccode=""):
              found = []
              if isinstance(node, dict):
                  # Direct league container: its matches list carries the league name.
                  local_league = str(node.get("name") or inherited_league)
                  local_ccode = str(node.get("ccode") or inherited_ccode).upper()
                  matches = node.get("matches")
                  if isinstance(matches, list):
                      for item in matches:
                          if isinstance(item, dict) and isinstance(item.get("home"), dict) and isinstance(item.get("away"), dict) and item.get("id") is not None:
                              found.append((local_league, local_ccode, item))
                  for key, value in node.items():
                      if key == "matches":
                          continue
                      found.extend(collect_match_pairs(value, local_league, local_ccode))
              elif isinstance(node, list):
                  for value in node:
                      found.extend(collect_match_pairs(value, inherited_league, inherited_ccode))
              return found

          league_items = collect_match_pairs(payload)
          seen_ids = set()

          for league_name, league_ccode, match in league_items:
              try:
                  match_id = int(match.get("id") or 0)
              except (TypeError, ValueError):
                  match_id = 0
              if match_id <= 0 or match_id in seen_ids:
                  continue
              seen_ids.add(match_id)

              home = match.get("home") or {}
              away = match.get("away") or {}
              status = match.get("status") or {}
              utc_time = str(status.get("utcTime") or "")
              dt = None
              if utc_time:
                  try:
                      dt = datetime.fromisoformat(utc_time.replace("Z", "+00:00")).astimezone(tz)
                  except ValueError:
                      pass

              started = bool(status.get("started"))
              finished = bool(status.get("finished"))
              cancelled = bool(status.get("cancelled"))
              live = started and not finished and not cancelled
              score_home = home.get("score")
              score_away = away.get("score")

              records.append({
                  "id": match_id,
                  "home": str(home.get("name") or "Home"),
                  "away": str(away.get("name") or "Away"),
                  "time": dt.strftime("%H:%M") if dt else str(match.get("time") or "--:--"),
                  "timestamp": int(dt.timestamp()) if dt else 0,
                  "league": league_name,
                  "status": "LIVE" if live else ("FT" if finished else ("CANCELLED" if cancelled else "NS")),
                  "live": live,
                  "scoreHome": as_int(score_home),
                  "scoreAway": as_int(score_away),
                  "stats": {},
              })

          records = [r for r in records if r["id"] > 0]
          if not records:
              raise SystemExit("FotMob returned a valid response but zero match records were found")

          # Manteniamo i principali campionati/competizioni. Il ccode evita
          # l'ambiguita di nomi come "Premier League" tra paesi diversi.
          TOP_COMPETITIONS = {
              "ENG": {"premier league"},
              "ITA": {"serie a", "serie b"},
              "ESP": {"laliga", "la liga", "laliga2"},
              "GER": {"bundesliga", "2. bundesliga"},
              "FRA": {"ligue 1", "ligue 2"},
              "NED": {"eredivisie"},
              "PRT": {"liga portugal"},
              "BEL": {"belgian pro league"},
              "TUR": {"super lig", "super league"},
              "SCO": {"premiership"},
              "BRA": {"série a", "serie a"},
              "ARG": {"liga profesional", "primera división"},
              "USA": {"major league soccer", "mls"},
              "SAU": {"saudi pro league"},
              "INT": {"champions league", "europa league", "conference league"},
          }

          def is_top_competition(ccode, name):
              wanted = TOP_COMPETITIONS.get((ccode or "").upper())
              if not wanted:
                  return False
              normalized = " ".join(str(name or "").lower().split())
              return any(x in normalized for x in wanted)

          top_ids = {
              int(match.get("id") or 0)
              for league_name, league_ccode, match in league_items
              if is_top_competition(league_ccode, league_name)
          }
          records = [r for r in records if r["id"] in top_ids]
          if not records:
              raise SystemExit("Nessuna partita dei top campionati per oggi")


              raise SystemExit("FotMob returned a valid response but zero match records were found")
          records.sort(key=lambda x: (not x["live"], x["timestamp"], x["home"]))

          # Tentiamo le statistiche su tutte le partite dei top campionati.
          # Per le gare non ancora iniziate il provider puo restituire dati vuoti.
          need_stats = records[:180]
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = {pool.submit(fetch_stats, r["id"]): r for r in need_stats}
              for future in as_completed(futures):
                  futures[future]["stats"] = future.result()

          # ------------------------------------------------------------------
          # Secondo livello statistiche: API-Football.
          # FotMob resta la fonte primaria. Usiamo API-Football solo per le
          # partite che FotMob non ha ancora valorizzato, così non sovrascriviamo
          # mai dati già presenti.
          # ------------------------------------------------------------------
          api_football_key = os.environ.get("API_FOOTBALL_KEY", "").strip()

          def norm_team(name):
              import unicodedata
              text = unicodedata.normalize("NFKD", str(name or ""))
              text = "".join(ch for ch in text if not unicodedata.combining(ch))
              return "".join(ch.lower() if ch.isalnum() else " " for ch in text).split()

          def same_team(a, b):
              aa, bb = norm_team(a), norm_team(b)
              if not aa or not bb:
                  return False
              sa, sb = set(aa), set(bb)
              return aa == bb or aa[:2] == bb[:2] or (len(sa & sb) >= max(1, min(len(sa), len(sb)) - 1))

          def api_request(path):
              req = urllib.request.Request(
                  "https://v3.football.api-sports.io" + path,
                  headers={
                      "x-apisports-key": api_football_key,
                      "Accept": "application/json",
                      "User-Agent": "MatchAIProFeed/1.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          def api_stat_value(block, wanted):
              for item in block.get("statistics", []) if isinstance(block, dict) else []:
                  if not isinstance(item, dict):
                      continue
                  if str(item.get("type") or "").strip().lower() != wanted.lower():
                      continue
                  value = item.get("value")
                  parsed = as_int(value)
                  return parsed if parsed is not None else 0
              return 0

          def api_match_stats(fixture):
              try:
                  fixture_id = int(fixture.get("fixture", {}).get("id") or 0)
                  teams = fixture.get("teams") or {}
                  home_name = (teams.get("home") or {}).get("name") or ""
                  away_name = (teams.get("away") or {}).get("name") or ""
                  if fixture_id <= 0:
                      return None
                  detail = api_request(f"/fixtures/statistics?fixture={fixture_id}")
                  rows = detail.get("response") or []
                  if len(rows) < 2:
                      return None
                  home = rows[0]
                  away = rows[1]
                  if not same_team(home_name, (home.get("team") or {}).get("name")):
                      home, away = away, home
                  return {
                      "homeShots": api_stat_value(home, "Total Shots"),
                      "awayShots": api_stat_value(away, "Total Shots"),
                      "homeOn": api_stat_value(home, "Shots on Goal"),
                      "awayOn": api_stat_value(away, "Shots on Goal"),
                      "homeCorners": api_stat_value(home, "Corner Kicks"),
                      "awayCorners": api_stat_value(away, "Corner Kicks"),
                      "homeFouls": api_stat_value(home, "Fouls"),
                      "awayFouls": api_stat_value(away, "Fouls"),
                      "homeCards": api_stat_value(home, "Yellow Cards") + api_stat_value(home, "Red Cards"),
                      "awayCards": api_stat_value(away, "Yellow Cards") + api_stat_value(away, "Red Cards"),
                      "homeThrow": api_stat_value(home, "Throw-ins"),
                      "awayThrow": api_stat_value(away, "Throw-ins"),
                      "homeSaves": api_stat_value(home, "Goalkeeper Saves"),
                      "awaySaves": api_stat_value(away, "Goalkeeper Saves"),
                  }
              except Exception:
                  return None

          def has_any_stats(stats):
              return isinstance(stats, dict) and any(as_int(v) is not None and as_int(v) > 0 for v in stats.values())

          if api_football_key:
              try:
                  api_payload = api_request(f"/fixtures?date={iso_date}&timezone=Europe%2FZurich")
                  fixtures = api_payload.get("response") or []
                  missing = [r for r in records if not has_any_stats(r.get("stats")) and r.get("live")]
                  # Per non sprecare chiamate sul piano API, aggiorniamo prima
                  # le partite live. Le terminate/future restano candidate al
                  # successivo ciclo del feed.
                  candidates = []
                  for fixture in fixtures:
                      if not isinstance(fixture, dict):
                          continue
                      teams = fixture.get("teams") or {}
                      hn = (teams.get("home") or {}).get("name") or ""
                      an = (teams.get("away") or {}).get("name") or ""
                      for record in missing:
                          if same_team(record["home"], hn) and same_team(record["away"], an):
                              candidates.append((record, fixture))
                              break
                  with ThreadPoolExecutor(max_workers=5) as pool:
                      futures = {pool.submit(api_match_stats, fixture): record for record, fixture in candidates[:15]}
                      for future in as_completed(futures):
                          stats = future.result()
                          if stats and has_any_stats(stats):
                              futures[future]["stats"] = stats
              except Exception as exc:
                  print(f"API-Football fallback skipped: {exc}")

          # ------------------------------------------------------------------
          # Terzo livello: SofaScore. Nessuna chiave richiesta.
          # Una sola chiamata per l'elenco giornaliero, poi statistiche solo
          # sulle partite live senza dati. Anche qui non sovrascriviamo mai.
          # ------------------------------------------------------------------
          try:
              scheduled_url = f"https://www.sofascore.com/api/v1/sport/football/scheduled-events/{iso_date}"
              req = urllib.request.Request(scheduled_url, headers={"User-Agent": "MatchAIProFeed/1.0", "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  sofa_events = (json.loads(r.read().decode("utf-8")).get("events") or [])
              sofa_map = {}
              for event in sofa_events:
                  if not isinstance(event, dict):
                      continue
                  home = (event.get("homeTeam") or {}).get("name") or ""
                  away = (event.get("awayTeam") or {}).get("name") or ""
                  if home and away:
                      sofa_map[(tuple(norm_team(home)), tuple(norm_team(away)))] = event
              missing = [r for r in records if not has_any_stats(r.get("stats")) and r.get("live")]
              def sofa_stats(record):
                  for (hn, an), event in sofa_map.items():
                      if same_team(record["home"], " ".join(hn)) and same_team(record["away"], " ".join(an)):
                          try:
                              event_id = int(event.get("id") or 0)
                              req = urllib.request.Request(
                                  f"https://www.sofascore.com/api/v1/event/{event_id}/statistics",
                                  headers={"User-Agent": "MatchAIProFeed/1.0", "Accept": "application/json"},
                              )
                              with urllib.request.urlopen(req, timeout=15) as r:
                                  data = json.loads(r.read().decode("utf-8"))
                              all_period = next((p for p in data.get("statistics", []) if isinstance(p, dict) and p.get("period") == "ALL"), None)
                              if not all_period:
                                  return None
                              home_values, away_values = {}, {}
                              for group in all_period.get("groups", []):
                                  for item in (group.get("statisticsItems") or []):
                                      name = str(item.get("name") or "").lower()
                                      h, a = as_int(item.get("home")), as_int(item.get("away"))
                                      if h is not None: home_values[name] = h
                                      if a is not None: away_values[name] = a
                              def sv(d, keys):
                                  for key in keys:
                                      if key in d: return d[key]
                                  return 0
                              return {
                                  "homeShots": sv(home_values, ["total shots on goal", "shots"]),
                                  "awayShots": sv(away_values, ["total shots on goal", "shots"]),
                                  "homeOn": sv(home_values, ["shots on target"]),
                                  "awayOn": sv(away_values, ["shots on target"]),
                                  "homeCorners": sv(home_values, ["corner kicks"]),
                                  "awayCorners": sv(away_values, ["corner kicks"]),
                                  "homeFouls": sv(home_values, ["fouls"]),
                                  "awayFouls": sv(away_values, ["fouls"]),
                                  "homeCards": sv(home_values, ["yellow cards"]) + sv(home_values, ["red cards"]),
                                  "awayCards": sv(away_values, ["yellow cards"]) + sv(away_values, ["red cards"]),
                                  "homeThrow": sv(home_values, ["throw-ins"]),
                                  "awayThrow": sv(away_values, ["throw-ins"]),
                                  "homeSaves": sv(home_values, ["goalkeeper saves", "saves"]),
                                  "awaySaves": sv(away_values, ["goalkeeper saves", "saves"]),
                              }
                          except Exception:
                              return None
                  return None
              with ThreadPoolExecutor(max_workers=5) as pool:
                  futures = {pool.submit(sofa_stats, record): record for record in missing[:10]}
                  for future in as_completed(futures):
                      stats = future.result()
                      if stats and has_any_stats(stats):
                          futures[future]["stats"] = stats
          except Exception as exc:
              print(f"SofaScore fallback skipped: {exc}")

          # Pubblica i top campionati anche quando una gara non e ancora iniziata:
          # l'app mostra "Statistiche in attesa" e non inventa alcun valore.

          out = {
              "source": "FotMob",
              "date": iso_date,
              "updatedAt": datetime.now(tz).isoformat(),
              "matches": records,
          }

          os.makedirs("data", exist_ok=True)
          for path in (f"data/{iso_date}.json", "data/latest.json", "data/today.json"):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(out, f, ensure_ascii=False, separators=(",", ":"))

          print(f"Feed ready: {len(records)} matches with stats; stats attempted for {len(need_stats)} matches.")
          PY

      - name: Export optional statistics API key
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -n "$API_FOOTBALL_KEY" ]; then
            echo "API-Football fallback enabled"
          else
            echo "API-Football fallback not configured; continuing with FotMob/SofaScore"
          fi

      - name: Publish feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No feed changes."
            exit 0
          fi
          git commit -m "data: update football feed"
          git push
