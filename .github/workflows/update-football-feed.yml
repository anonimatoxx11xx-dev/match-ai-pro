name: Update football feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

concurrency:
  group: match-ai-pro-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FotMob feed
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Zurich")
          now = datetime.now(tz)
          date = now.strftime("%Y%m%d")
          iso_date = now.date().isoformat()

          url = f"https://www.fotmob.com/api/data/matches?date={date}&timezone=Europe%2FZurich&ccode3=ITA"
          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 14) MatchAIPro/1.0",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
          }

          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload = json.loads(r.read().decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"FotMob feed failed: {exc}")

          def as_int(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  return int(value)
              if isinstance(value, str):
                  try:
                      return int(float(value.replace("%", "").strip()))
                  except ValueError:
                      return None
              return None

          def iter_stat_entries(node):
              """
              FotMob groups match stats in nested sections such as:
              Top stats -> stats -> [ {title, stats:[home,away]}, ... ].
              Walk every nested list/dict so the parser keeps working if
              FotMob adds another grouping layer.
              """
              if isinstance(node, dict):
                  title = node.get("title")
                  values = node.get("stats")
                  if title is not None and isinstance(values, list) and len(values) >= 2:
                      yield node
                  for value in node.values():
                      yield from iter_stat_entries(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from iter_stat_entries(value)

          def pick(block, titles):
              wanted = [x.lower() for x in titles]
              for item in iter_stat_entries(block):
                  title = str(item.get("title") or "").strip().lower()
                  if not any(w == title or w in title for w in wanted):
                      continue
                  values = item.get("stats")
                  if not isinstance(values, list) or len(values) < 2:
                      continue
                  h, a = as_int(values[0]), as_int(values[1])
                  if h is not None and a is not None:
                      return h, a
              return 0, 0

          def fetch_stats(match_id):
              detail_url = f"https://www.fotmob.com/api/data/matchDetails?matchId={match_id}"
              try:
                  req = urllib.request.Request(detail_url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = json.loads(r.read().decode("utf-8"))
                  content = body.get("content") or {}
                  periods = content.get("stats", {}).get("Periods", {})
                  all_stats = periods.get("All", {}) if isinstance(periods, dict) else {}
                  items = all_stats.get("stats", []) if isinstance(all_stats, dict) else []
                  if not isinstance(items, list):
                      return {}
                  shots = pick(items, ["total shots", "shots"])
                  on = pick(items, ["shots on target", "shots on goal"])
                  corners = pick(items, ["corners"])
                  fouls = pick(items, ["fouls"])
                  yellow = pick(items, ["yellow cards"])
                  red = pick(items, ["red cards"])
                  throwins = pick(items, ["throw-ins", "throw ins"])
                  saves = pick(items, ["saves", "goalkeeper saves"])
                  return {
                      "homeShots": shots[0], "awayShots": shots[1],
                      "homeOn": on[0], "awayOn": on[1],
                      "homeCorners": corners[0], "awayCorners": corners[1],
                      "homeFouls": fouls[0], "awayFouls": fouls[1],
                      "homeCards": yellow[0] + red[0], "awayCards": yellow[1] + red[1],
                      "homeThrow": throwins[0], "awayThrow": throwins[1],
                      "homeSaves": saves[0], "awaySaves": saves[1],
                  }
              except Exception:
                  return {}

          records = []

          def collect_match_pairs(node, inherited_league="Football"):
              found = []
              if isinstance(node, dict):
                  # Direct league container: its matches list carries the league name.
                  local_league = str(node.get("name") or inherited_league)
                  matches = node.get("matches")
                  if isinstance(matches, list):
                      for item in matches:
                          if isinstance(item, dict) and isinstance(item.get("home"), dict) and isinstance(item.get("away"), dict) and item.get("id") is not None:
                              found.append((local_league, item))
                  for key, value in node.items():
                      if key == "matches":
                          continue
                      found.extend(collect_match_pairs(value, local_league))
              elif isinstance(node, list):
                  for value in node:
                      found.extend(collect_match_pairs(value, inherited_league))
              return found

          league_items = collect_match_pairs(payload)
          seen_ids = set()

          for league_name, match in league_items:
              try:
                  match_id = int(match.get("id") or 0)
              except (TypeError, ValueError):
                  match_id = 0
              if match_id <= 0 or match_id in seen_ids:
                  continue
              seen_ids.add(match_id)

              home = match.get("home") or {}
              away = match.get("away") or {}
              status = match.get("status") or {}
              utc_time = str(status.get("utcTime") or "")
              dt = None
              if utc_time:
                  try:
                      dt = datetime.fromisoformat(utc_time.replace("Z", "+00:00")).astimezone(tz)
                  except ValueError:
                      pass

              started = bool(status.get("started"))
              finished = bool(status.get("finished"))
              cancelled = bool(status.get("cancelled"))
              live = started and not finished and not cancelled
              score_home = home.get("score")
              score_away = away.get("score")

              records.append({
                  "id": match_id,
                  "home": str(home.get("name") or "Home"),
                  "away": str(away.get("name") or "Away"),
                  "time": dt.strftime("%H:%M") if dt else str(match.get("time") or "--:--"),
                  "timestamp": int(dt.timestamp()) if dt else 0,
                  "league": league_name,
                  "status": "LIVE" if live else ("FT" if finished else ("CANCELLED" if cancelled else "NS")),
                  "live": live,
                  "scoreHome": as_int(score_home),
                  "scoreAway": as_int(score_away),
                  "stats": {},
              })

          records = [r for r in records if r["id"] > 0]
          if not records:
              raise SystemExit("FotMob returned a valid response but zero match records were found")
          records.sort(key=lambda x: (not x["live"], x["timestamp"], x["home"]))

          need_stats = [r for r in records if r["live"] or r["status"] == "FT"][:100]
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = {pool.submit(fetch_stats, r["id"]): r for r in need_stats}
              for future in as_completed(futures):
                  futures[future]["stats"] = future.result()

          # Pubblica solo partite per cui FotMob ha restituito dati statistici.
          # In questo modo l'app non mostra competizioni/partite che non possiamo
          # alimentare con tiri, corner, falli, cartellini e parate.
          records_with_stats = [r for r in records if isinstance(r.get("stats"), dict) and r["stats"]]
          records = records_with_stats

          out = {
              "source": "FotMob",
              "date": iso_date,
              "updatedAt": datetime.now(tz).isoformat(),
              "matches": records,
          }

          os.makedirs("data", exist_ok=True)
          for path in (f"data/{iso_date}.json", "data/latest.json", "data/today.json"):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(out, f, ensure_ascii=False, separators=(",", ":"))

          print(f"Feed ready: {len(records)} matches with stats; stats attempted for {len(need_stats)} matches.")
          PY

      - name: Publish feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No feed changes."
            exit 0
          fi
          git commit -m "data: update football feed"
          git push
