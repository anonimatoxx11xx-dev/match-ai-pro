name: Update football feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

concurrency:
  group: match-ai-pro-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SofaScore football feed
        shell: bash
        run: |
          python3 -m pip install -q curl_cffi
          python3 <<'PY'
          import json
          import re
          from curl_cffi import requests
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Europe/Zurich")
          NOW = datetime.now(TZ)
          ISO_DATE = NOW.date().isoformat()

          HEADERS = {
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "it-IT,it;q=0.9,en-US;q=0.8",
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Origin": "https://www.sofascore.com",
              "Referer": "https://www.sofascore.com/",
              "Cache-Control": "no-cache",
              "X-Requested-With": "XMLHttpRequest",
          }

          session = requests.Session()

          def get_json(url, timeout=20):
              response = session.get(
                  url,
                  headers=HEADERS,
                  impersonate="chrome",
                  timeout=timeout,
              )
              response.raise_for_status()
              return response.json()

          def as_int(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  return int(value)
              if isinstance(value, str):
                  match = re.search(r"-?\d+", value.replace("%", ""))
                  return int(match.group()) if match else None
              return None

          def score_value(value):
              if not isinstance(value, dict):
                  return None
              for key in ("current", "display", "normaltime"):
                  parsed = as_int(value.get(key))
                  if parsed is not None:
                      return parsed
              return None

          def state(event):
              kind = str((event.get("status") or {}).get("type") or "").lower()
              live = kind in {"inprogress", "halftime", "extra_time", "penalties", "interrupted"}
              finished = kind in {"finished", "ended", "afterextra", "afterpenalties"}
              return live, finished

          def record(event):
              home = event.get("homeTeam") or {}
              away = event.get("awayTeam") or {}
              tournament = event.get("tournament") or {}
              live, finished = state(event)
              timestamp = as_int(event.get("startTimestamp")) or 0
              dt = datetime.fromtimestamp(timestamp, TZ) if timestamp else None
              return {
                  "id": as_int(event.get("id")) or 0,
                  "home": str(home.get("name") or "Home"),
                  "away": str(away.get("name") or "Away"),
                  "time": dt.strftime("%H:%M") if dt else "--:--",
                  "timestamp": timestamp,
                  "league": str(tournament.get("name") or "Football"),
                  "status": "LIVE" if live else ("FT" if finished else "NS"),
                  "live": live,
                  "scoreHome": score_value(event.get("homeScore")),
                  "scoreAway": score_value(event.get("awayScore")),
                  "homeTeamId": as_int(home.get("id")),
                  "awayTeamId": as_int(away.get("id")),
                  "priority": as_int(tournament.get("priority")) or 0,
                  "stats": {},
                  "proposals": [],
                  "proposalScore": 0,
              }

          def load_events():
              urls = [
                  f"https://api.sofascore.app/api/v1/sport/football/scheduled-events/{ISO_DATE}",
                  f"https://www.sofascore.com/api/v1/sport/football/scheduled-events/{ISO_DATE}",
              ]
              last_error = None
              for url in urls:
                  try:
                      data = get_json(url, 25)
                      events = data.get("events") or []
                      if events:
                          return events, url
                  except Exception as exc:
                      last_error = exc
              raise RuntimeError("SofaScore scheduled events unavailable: " + str(last_error))

          def stat_num(item, side):
              parsed = as_int(item.get(side + "Value"))
              if parsed is not None:
                  return parsed
              return as_int(item.get(side))

          def stat_pair(items, aliases):
              aliases = {x.lower() for x in aliases}
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  key = str(item.get("key") or "").lower()
                  name = str(item.get("name") or "").lower()
                  if not (key in aliases or name in aliases or any(a in key or a in name for a in aliases)):
                      continue
                  home = stat_num(item, "home")
                  away = stat_num(item, "away")
                  if home is not None and away is not None:
                      return home, away
              return None, None

          def match_stats(event_id):
              try:
                  data = get_json(
                      "https://api.sofascore.app/api/v1/event/" + str(event_id) + "/statistics",
                      18,
                  )
                  period = next(
                      (p for p in data.get("statistics", []) if isinstance(p, dict) and p.get("period") == "ALL"),
                      None,
                  )
                  if not period:
                      return {}
                  items = []
                  for group in period.get("groups") or []:
                      items.extend(group.get("statisticsItems") or [])
                  result = {}
                  mapping = [
                      (("homeShots", "awayShots"), {"totalshots", "total shots", "shots"}),
                      (("homeOn", "awayOn"), {"shotsontarget", "shots on target", "shotsongoal"}),
                      (("homeCorners", "awayCorners"), {"cornerkicks", "corner kicks", "corners"}),
                      (("homeFouls", "awayFouls"), {"fouls"}),
                      (("homeThrow", "awayThrow"), {"throwins", "throw-ins", "throw ins"}),
                      (("homeSaves", "awaySaves"), {"goalkeepersaves", "goalkeeper saves", "saves"}),
                  ]
                  for keys, aliases in mapping:
                      home, away = stat_pair(items, aliases)
                      if home is not None and away is not None:
                          result[keys[0]], result[keys[1]] = home, away
                  yh, ya = stat_pair(items, {"yellowcards", "yellow cards"})
                  rh, ra = stat_pair(items, {"redcards", "red cards"})
                  if yh is not None and ya is not None:
                      result["homeCards"] = yh + (rh or 0)
                      result["awayCards"] = ya + (ra or 0)
                  return result
              except Exception:
                  return {}

          def recent(team_id):
              if not team_id:
                  return None
              try:
                  data = get_json(
                      "https://api.sofascore.app/api/v1/team/" + str(team_id) + "/events/last/0",
                      15,
                  )
                  games = 0
                  gf = ga = btts = over15 = over25 = 0
                  for event in data.get("events") or []:
                      live, finished = state(event)
                      if not finished:
                          continue
                      hs = score_value(event.get("homeScore"))
                      aw = score_value(event.get("awayScore"))
                      if hs is None or aw is None:
                          continue
                      home_id = as_int((event.get("homeTeam") or {}).get("id"))
                      if home_id == team_id:
                          scored, conceded = hs, aw
                      else:
                          scored, conceded = aw, hs
                      gf += scored
                      ga += conceded
                      btts += int(hs > 0 and aw > 0)
                      over15 += int(hs + aw >= 2)
                      over25 += int(hs + aw >= 3)
                      games += 1
                      if games >= 5:
                          break
                  if games == 0:
                      return None
                  return {
                      "gf": gf / games,
                      "ga": ga / games,
                      "btts": btts / games,
                      "over15": over15 / games,
                      "over25": over25 / games,
                  }
              except Exception:
                  return None

          def form_points(items):
              return sum({"W": 3, "D": 1, "L": 0}.get(str(x).upper(), 0) for x in (items or [])[-5:])

          def proposals(record_item, form_data, home_recent, away_recent):
              home_team = (form_data.get("homeTeam") or {}) if isinstance(form_data, dict) else {}
              away_team = (form_data.get("awayTeam") or {}) if isinstance(form_data, dict) else {}
              hp = form_points(home_team.get("form") or [])
              ap = form_points(away_team.get("form") or [])

              items = []
              index = 50

              if hp >= ap + 3:
                  items.append("1X • forma recente favorevole alla squadra di casa")
                  index += 8
              elif ap >= hp + 3:
                  items.append("X2 • forma recente favorevole alla squadra ospite")
                  index += 8
              else:
                  items.append("1X2 equilibrato • nessun vantaggio netto dalla forma")
                  index += 3

              if home_recent and away_recent:
                  expected = (
                      home_recent["gf"]
                      + away_recent["ga"]
                      + away_recent["gf"]
                      + home_recent["ga"]
                  ) / 2
                  btts = (home_recent["btts"] + away_recent["btts"]) / 2
                  over15 = (home_recent["over15"] + away_recent["over15"]) / 2
                  over25 = (home_recent["over25"] + away_recent["over25"]) / 2

                  if expected >= 2.35 or over15 >= 0.70:
                      items.append("Over 1.5 • ritmo delle ultime 5 gare")
                      index += 10
                  if expected >= 2.90 and over25 >= 0.60:
                      items.append("Over 2.5 • produzione offensiva recente sostenuta")
                      index += 8
                  elif btts >= 0.65:
                      items.append("Goal/Goal • entrambe segnano con frequenza")
                      index += 8
                  elif expected <= 2.15 and over25 <= 0.40:
                      items.append("Under 3.5 • profilo recente contenuto")
                      index += 6

              record_item["proposals"] = items[:3]
              record_item["proposalScore"] = max(50, min(88, index))

          events, source_url = load_events()
          records = []
          seen = set()

          for event in events:
              if not isinstance(event, dict):
                  continue
              item = record(event)
              if item["id"] <= 0 or item["id"] in seen:
                  continue
              seen.add(item["id"])
              records.append(item)

          records.sort(
              key=lambda x: (not x["live"], -x["priority"], x["timestamp"], x["home"])
          )
          records = records[:150]

          candidates = [x for x in records if x["live"] or x["status"] == "FT"][:60]
          with ThreadPoolExecutor(max_workers=10) as pool:
              futures = {pool.submit(match_stats, x["id"]): x for x in candidates}
              for future in as_completed(futures):
                  futures[future]["stats"] = future.result()

          upcoming = [
              x for x in records
              if x["status"] == "NS" and x["homeTeamId"] and x["awayTeamId"]
          ][:25]

          forms = {}
          with ThreadPoolExecutor(max_workers=8) as pool:
              def get_form(item):
                  try:
                      return get_json(
                          "https://api.sofascore.app/api/v1/event/" + str(item["id"]) + "/pregame-form",
                          12,
                      )
                  except Exception:
                      return {}
              futures = {pool.submit(get_form, x): x for x in upcoming}
              for future in as_completed(futures):
                  forms[futures[future]["id"]] = future.result()

          team_ids = []
          for item in upcoming:
              for team_id in (item["homeTeamId"], item["awayTeamId"]):
                  if team_id and team_id not in team_ids:
                      team_ids.append(team_id)

          recent_map = {}
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = {pool.submit(recent, team_id): team_id for team_id in team_ids[:50]}
              for future in as_completed(futures):
                  recent_map[futures[future]] = future.result()

          for item in upcoming:
              form_data = forms.get(item["id"], {})
              home_recent = recent_map.get(item["homeTeamId"])
              away_recent = recent_map.get(item["awayTeamId"])
              if form_data or home_recent or away_recent:
                  proposals(item, form_data, home_recent, away_recent)

          output = {
              "source": "SofaScore",
              "sourceUrl": source_url,
              "date": ISO_DATE,
              "updatedAt": datetime.now(TZ).isoformat(),
              "matches": records,
          }

          import os
          os.makedirs("data", exist_ok=True)
          for path in (
              "data/" + ISO_DATE + ".json",
              "data/latest.json",
              "data/today.json",
          ):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(output, f, ensure_ascii=False, separators=(",", ":"))

          print(
              "Feed ready: "
              + str(len(records))
              + " matches, stats="
              + str(sum(bool(x.get("stats")) for x in records))
              + ", proposals="
              + str(sum(bool(x.get("proposals")) for x in records))
              + ", source=SofaScore"
          )
          PY

      - name: Publish feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No feed changes."
            exit 0
          fi
          git commit -m "data: update SofaScore football feed"
          git push
