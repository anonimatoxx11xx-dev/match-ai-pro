name: Update football feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

concurrency:
  group: match-ai-pro-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SofaScore football feed
        env:
          APP_RAPIDAPI_KEY: ${{ secrets.APP_RAPIDAPI_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FOOTBALLDATA_IO_KEY: ${{ secrets.FOOTBALLDATA_IO_KEY }}
        shell: bash
        run: |
          python3 -m pip install -q curl_cffi
          python3 <<'PY'
          import difflib
          import json
          import os
          import re
          from curl_cffi import requests
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Europe/Zurich")
          NOW = datetime.now(TZ)
          ISO_DATE = NOW.date().isoformat()

          HEADERS = {
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "it-IT,it;q=0.9,en-US;q=0.8",
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Origin": "https://www.sofascore.com",
              "Referer": "https://www.sofascore.com/",
              "Cache-Control": "no-cache",
              "X-Requested-With": "XMLHttpRequest",
          }

          session = requests.Session()

          def get_json(url, timeout=20):
              response = session.get(
                  url,
                  headers=HEADERS,
                  impersonate="chrome",
                  timeout=timeout,
              )
              response.raise_for_status()
              return response.json()

          def as_int(value):
              if isinstance(value, bool):
                  return None
              if isinstance(value, (int, float)):
                  return int(value)
              if isinstance(value, str):
                  match = re.search(r"-?\d+", value.replace("%", ""))
                  return int(match.group()) if match else None
              return None

          def score_value(value):
              if not isinstance(value, dict):
                  return None
              for key in ("current", "display", "normaltime"):
                  parsed = as_int(value.get(key))
                  if parsed is not None:
                      return parsed
              return None

          def state(event):
              kind = str((event.get("status") or {}).get("type") or "").lower()
              live = kind in {"inprogress", "halftime", "extra_time", "penalties", "interrupted"}
              finished = kind in {"finished", "ended", "afterextra", "afterpenalties"}
              return live, finished

          def record(event):
              home = event.get("homeTeam") or {}
              away = event.get("awayTeam") or {}
              tournament = event.get("tournament") or {}
              live, finished = state(event)
              timestamp = as_int(event.get("startTimestamp")) or 0
              dt = datetime.fromtimestamp(timestamp, TZ) if timestamp else None
              return {
                  "id": as_int(event.get("id")) or 0,
                  "home": str(home.get("name") or "Home"),
                  "away": str(away.get("name") or "Away"),
                  "time": dt.strftime("%H:%M") if dt else "--:--",
                  "timestamp": timestamp,
                  "league": str(tournament.get("name") or "Football"),
                  "status": "LIVE" if live else ("FT" if finished else "NS"),
                  "live": live,
                  "scoreHome": None if str((event.get("status") or {}).get("type") or "").lower() in {"notstarted","scheduled"} else score_value(event.get("homeScore")),
                  "scoreAway": None if str((event.get("status") or {}).get("type") or "").lower() in {"notstarted","scheduled"} else score_value(event.get("awayScore")),
                  "homeTeamId": as_int(home.get("id")),
                  "awayTeamId": as_int(away.get("id")),
                  "priority": as_int(tournament.get("priority")) or 0,
                  "stats": {},
                  "proposals": [],
                  "proposalScore": 0,
                  "preMatchStats": [],
              }

          def espn_record(event):
              competitions = event.get("competitions") or []
              comp = competitions[0] if competitions else {}
              competitors = comp.get("competitors") or []
              home = next((x for x in competitors if x.get("homeAway") == "home"), competitors[0] if competitors else {})
              away = next((x for x in competitors if x.get("homeAway") == "away"), competitors[1] if len(competitors) > 1 else {})
              home_team = home.get("team") or {}
              away_team = away.get("team") or {}
              competition = (comp.get("league") or comp.get("competition") or event.get("league") or {})
              league = event.get("_match_ai_league") or ((competition.get("name") if isinstance(competition, dict) else None)) or ((event.get("season") or {}).get("displayName")) or "Football"
              date_value = str(event.get("date") or "")
              timestamp = 0
              if date_value:
                  try:
                      timestamp = int(datetime.fromisoformat(date_value.replace("Z", "+00:00")).timestamp())
                  except Exception:
                      timestamp = 0
              status_obj = event.get("status") or {}
              status_type = status_obj.get("type") or {}
              state_name = str(status_type.get("state") or "").lower()
              completed = bool(status_type.get("completed")) or state_name in {"post", "final"}
              live = state_name in {"in", "live"}
              status = "LIVE" if live else ("FT" if completed else "NS")
              score_home = score_value(home.get("score")) if completed or live else None
              score_away = score_value(away.get("score")) if completed or live else None
              local_dt = datetime.fromtimestamp(timestamp, TZ) if timestamp else None
              display_time = local_dt.strftime("%H:%M") if local_dt else "--:--"
              if event.get("_match_ai_future_date") and local_dt:
                  display_time = local_dt.strftime("%Y-%m-%d|%H:%M")
              return {
                  "id": as_int(event.get("id")) or 0,
                  "home": str(home_team.get("displayName") or home_team.get("name") or "Home"),
                  "away": str(away_team.get("displayName") or away_team.get("name") or "Away"),
                  "time": display_time,
                  "timestamp": timestamp,
                  "league": str(league),
                  "status": status,
                  "live": live,
                  "scoreHome": score_home,
                  "scoreAway": score_away,
                  "homeTeamId": as_int(home_team.get("id") or home.get("id")),
                  "awayTeamId": as_int(away_team.get("id") or away.get("id")),
                  "priority": 1,
                  "stats": {},
                  "proposals": [],
                  "proposalScore": 0,
                  "preMatchStats": [],
              }

          # ESPN exposes separate soccer league scoreboards. Use a curated
          # set of top competitions instead of the global "all" feed, which also
          # contains low-priority college/minor competitions.
          TOP_ESPN_LEAGUES = [
              # Requested competitions: Italy (Serie A/B), England (Premier to National League),
              # Netherlands, France (Ligue 1/2), Spain (La Liga/Segunda), Turkey and Germany.
              ("ita.1", "Serie A"),
              ("ita.2", "Serie B"),
              ("eng.1", "Premier League"),
              ("eng.2", "Championship"),
              ("eng.3", "League One"),
              ("eng.4", "League Two"),
              ("eng.5", "National League"),
              ("esp.1", "La Liga"),
              ("esp.2", "Segunda"),
              ("fra.1", "Ligue 1"),
              ("fra.2", "Ligue 2"),
              ("ned.1", "Eredivisie"),
              ("tur.1", "Turkish Super Lig"),
              ("ger.1", "Bundesliga"),
              ("ger.2", "2. Bundesliga"),
              # UEFA club competitions.
              ("uefa.champions", "UEFA Champions League"),
              ("uefa.europa", "UEFA Europa League"),
              ("uefa.europa.conf", "UEFA Conference League"),
              ("uefa.wchampions", "UEFA Women's Champions League"),
              # English domestic cups and major national competitions where ESPN exposes a scoreboard.
              ("eng.fa", "FA Cup"),
              ("eng.league_cup", "EFL Cup"),
              ("eng.community", "Community Shield"),
              ("esp.copa_del_rey", "Copa del Rey"),
              ("esp.supercopa", "Supercopa de España"),
              ("ger.dfb_pokal", "German DFB Pokal"),
              ("ita.coppa_italia", "Coppa Italia"),
              ("fra.coupe_de_france", "Coupe de France"),
              ("ned.knvb", "KNVB Cup"),
              ("tur.cup", "Turkish Cup"),
              # Women's top leagues for the same countries.
              ("eng.w.1", "Women's Super League"),
              ("esp.w.1", "Liga F"),
              ("ger.w.1", "Frauen-Bundesliga"),
              ("fra.w.1", "Première Ligue"),
              ("ita.w.1", "Serie A Femminile"),
              ("ned.w.1", "Vrouwen Eredivisie"),
          ]

          def load_espn_events(target_date=None):
              target_date = target_date or NOW.date()
              date_key = target_date.strftime("%Y%m%d")
              collected = []
              urls = []
              def fetch_league(slug, label):
                  url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/{slug}/scoreboard?dates={date_key}&limit=1000"
                  try:
                      data = get_json(url, 25)
                      events = data.get("events") or []
                      for event in events:
                          if isinstance(event, dict):
                              event["_match_ai_league"] = label
                              event["_match_ai_league_slug"] = slug
                      return events, url
                  except Exception as exc:
                      print("ESPN league failed:", slug, exc)
                      return [], url

              with ThreadPoolExecutor(max_workers=8) as pool:
                  futures = [pool.submit(fetch_league, slug, label) for slug, label in TOP_ESPN_LEAGUES]
                  for future in as_completed(futures):
                      events, url = future.result()
                      collected.extend(events)
                      if events:
                          urls.append(url)

              deduped = []
              seen_ids = set()
              for event in collected:
                  event_id = str(event.get("id") or "")
                  if not event_id or event_id in seen_ids:
                      continue
                  seen_ids.add(event_id)
                  deduped.append(event)

              # Some dates have very few events in the individual league
              # endpoints. In that case use ESPN's global scoreboard and keep only
              # recognized top competitions, so the app never collapses to 1 match.
              if len(deduped) < 10:
                  global_url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates={date_key}&limit=1000"
                  try:
                      global_data = get_json(global_url, 25)
                      global_events = global_data.get("events") or []
                      allowed = {
                          "Premier League","Championship","League One","League Two","National League",
                          "La Liga","Segunda","Serie A","Serie B","Bundesliga","2. Bundesliga",
                          "Ligue 1","Ligue 2","Eredivisie","Turkish Super Lig",
                          "UEFA Champions League","UEFA Europa League","UEFA Conference League",
                          "UEFA Women's Champions League","FA Cup","EFL Cup","Community Shield",
                          "Copa del Rey","Supercopa de España","German DFB Pokal","Coppa Italia",
                          "Coupe de France","KNVB Cup","Turkish Cup",
                          "Women's Super League","Liga F","Vrouwen Eredivisie","Frauen-Bundesliga",
                          "Première Ligue","Serie A Femminile",
                          "International Friendly","International Friendlies",
                          "UEFA Nations League","FIFA World Cup Qualifying",
                          "World Cup Qualifying - UEFA","World Cup Qualifying - CONMEBOL",
                          "World Cup Qualifying - CONCACAF","World Cup Qualifying - AFC",
                          "World Cup Qualifying - CAF","World Cup Qualifying - OFC",
                          "CONCACAF Nations League","Copa America","AFC Asian Cup",
                          "Africa Cup of Nations","Gold Cup"
                      }
                      filtered = []
                      for event in global_events:
                          comps = event.get("competitions") or []
                          comp = comps[0] if comps else {}
                          league_obj = comp.get("league") or {}
                          league_name = str(league_obj.get("name") or "").strip()
                          if league_name in allowed:
                              event["_match_ai_league"] = league_name
                              filtered.append(event)
                      if filtered:
                          deduped = filtered
                          source_url = global_url
                          print("ESPN global top-league fallback:", len(deduped), "events")
                          return deduped, source_url
                  except Exception as exc:
                      print("ESPN global fallback failed:", exc)

              if not deduped:
                  raise RuntimeError("ESPN top-league scoreboards returned no events")
              source_url = urls[0] if urls else "https://site.api.espn.com/apis/site/v2/sports/soccer"
              print("ESPN curated top-league fallback:", len(deduped), "events")
              return deduped, source_url

          def load_espn_recent_results(days_back=7):
              """Build recent team form from ESPN's public, keyless scoreboards."""
              today = NOW.date()
              events_by_team = {}
              for offset in range(1, days_back + 1):
                  day = today.fromordinal(today.toordinal() - offset)
                  date_key = day.strftime("%Y%m%d")
                  url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates={date_key}&limit=1000"
                  try:
                      payload = get_json(url, 25)
                      for event in payload.get("events") or []:
                          competitions = event.get("competitions") or []
                          comp = competitions[0] if competitions else {}
                          competitors = comp.get("competitors") or []
                          if len(competitors) < 2:
                              continue
                          status_type = ((event.get("status") or {}).get("type") or {})
                          state = str(status_type.get("state") or "").lower()
                          completed = bool(status_type.get("completed")) or state in {"post", "final"}
                          if not completed:
                              continue
                          home = next((x for x in competitors if x.get("homeAway") == "home"), competitors[0])
                          away = next((x for x in competitors if x.get("homeAway") == "away"), competitors[1])
                          home_team = home.get("team") or {}
                          away_team = away.get("team") or {}
                          hn = str(home_team.get("displayName") or home_team.get("name") or "")
                          an = str(away_team.get("displayName") or away_team.get("name") or "")
                          hs = as_int(home.get("score"))
                          aa = as_int(away.get("score"))
                          if not hn or not an or hs is None or aa is None:
                              continue
                          event_time = parse_provider_timestamp(event.get("date"))
                          rec = (hn, an, hs, aa, event_time)
                          for team_name, gf, ga in ((hn, hs, aa), (an, aa, hs)):
                              key = normalize_team_name(team_name)
                              if not key:
                                  continue
                              events_by_team.setdefault(key, []).append({
                                  "name": team_name,
                                  "gf": gf,
                                  "ga": ga,
                                  "opponent": an if team_name == hn else hn,
                                  "timestamp": event_time,
                                  "win": gf > ga,
                                  "draw": gf == ga,
                              })
                  except Exception as exc:
                      print("ESPN recent results failed:", date_key, exc)
              for key in events_by_team:
                  events_by_team[key].sort(key=lambda x: x.get("timestamp") or 0, reverse=True)
                  events_by_team[key] = events_by_team[key][:6]
              print("ESPN recent-form teams:", len(events_by_team))
              return events_by_team

          def format_form(rows):
              wins = sum(1 for x in rows if x.get("win"))
              draws = sum(1 for x in rows if x.get("draw"))
              losses = len(rows) - wins - draws
              points = wins * 3 + draws
              gf = sum(int(x.get("gf") or 0) for x in rows)
              ga = sum(int(x.get("ga") or 0) for x in rows)
              return f"{wins}V {draws}N {losses}P · {gf}-{ga} gol · {points}/{len(rows)*3 if rows else 0} pt"

          def enrich_with_espn_form(records):
              upcoming = [x for x in records if x.get("status") == "NS"][:40]
              if not upcoming:
                  return
              form_map = load_espn_recent_results(30)
              added = 0
              aliases = (
                  ("football club", ""),
                  ("fc ", ""),
                  ("sc ", ""),
                  ("afc ", ""),
                  ("club ", ""),
                  ("calcio ", ""),
                  ("clube ", ""),
                  ("ec ", ""),
                  ("ca ", ""),
              )

              def form_rows(team_name):
                  key = normalize_team_name(team_name)
                  rows = form_map.get(key) or []
                  if len(rows) >= 3:
                      return rows
                  compact = key
                  for src, dst in aliases:
                      compact = compact.replace(normalize_team_name(src), normalize_team_name(dst))
                  candidates = []
                  for candidate_key, candidate_rows in form_map.items():
                      if len(candidate_rows) < 3:
                          continue
                      candidate_compact = candidate_key
                      for src, dst in aliases:
                          candidate_compact = candidate_compact.replace(normalize_team_name(src), normalize_team_name(dst))
                      if not compact or not candidate_compact:
                          continue
                      score = difflib.SequenceMatcher(None, compact, candidate_compact).ratio()
                      if compact in candidate_compact or candidate_compact in compact:
                          score = max(score, 0.78)
                      if score >= 0.70:
                          candidates.append((score, candidate_rows))
                  candidates.sort(key=lambda x: x[0], reverse=True)
                  return candidates[0][1] if candidates else []

              for item in upcoming:
                  home_form = form_rows(item.get("home"))
                  away_form = form_rows(item.get("away"))
                  if len(home_form) < 2 or len(away_form) < 2:
                      continue

                  def ppg(rows):
                      return sum(3 if x["win"] else 1 if x["draw"] else 0 for x in rows) / len(rows)

                  def gdpg(rows):
                      return sum((x["gf"] - x["ga"]) for x in rows) / len(rows)

                  home_ppg, away_ppg = ppg(home_form), ppg(away_form)
                  home_gd, away_gd = gdpg(home_form), gdpg(away_form)
                  form_edge = (home_ppg - away_ppg) + 0.30 * (home_gd - away_gd)
                  home_avg_goals = sum(x["gf"] for x in home_form) / len(home_form)
                  away_avg_goals = sum(x["gf"] for x in away_form) / len(away_form)
                  combined_goals = home_avg_goals + away_avg_goals

                  pre = item.setdefault("preMatchStats", [])
                  pre.extend([
                      "Forma casa: " + format_form(home_form),
                      "Forma ospiti: " + format_form(away_form),
                      "Fonte forma: ESPN risultati recenti",
                  ])

                  stat_score = 56 + min(18, int(abs(form_edge) * 8))
                  if len(home_form) >= 5 and len(away_form) >= 5:
                      stat_score += 3
                  stat_score = max(56, min(77, stat_score))

                  market_score = item.get("proposalScore") or 0
                  market_pick = ""
                  for proposal in item.get("proposals") or []:
                      if "Winner • " in str(proposal):
                          market_pick = str(proposal).split("Winner • ", 1)[1].replace(" (market signal)", "").strip()
                          break

                  form_pick = item.get("home") if form_edge > 0.35 else item.get("away") if form_edge < -0.35 else ""
                  if form_pick:
                      if market_pick and market_pick != form_pick:
                          # Conflicting evidence: do not upgrade a weak market signal.
                          item["proposalScore"] = min(62, max(56, stat_score))
                          item["proposals"] = ["Conflitto evidenze • forma vs mercato"]
                      else:
                          combined = stat_score
                          if market_score >= 60 and market_pick == form_pick:
                              combined = round(stat_score * 0.65 + market_score * 0.35)
                          item["proposalScore"] = max(58, min(82, combined))
                          item["proposals"] = ["Winner • " + form_pick + " (forma + dati mercato)" if market_score >= 60 else "Winner • " + form_pick + " (forma recente)"]
                      added += 1
                  elif combined_goals >= 2.8:
                      item["proposalScore"] = max(58, min(68, 56 + int((combined_goals - 2.5) * 8)))
                      item["proposals"] = ["Over 1.5 • forma gol recente"]
                      added += 1
                  elif combined_goals <= 2.1:
                      item["proposalScore"] = max(58, min(67, 56 + int((2.5 - combined_goals) * 8)))
                      item["proposals"] = ["Under 3.5 • forma gol recente"]
                      added += 1
              print("ESPN statistical enrichment:", added, "matches")

          def espn_proposal(item, event):
              if item.get("status") != "NS":
                  return
              competitions = event.get("competitions") or []
              comp = competitions[0] if competitions else {}
              odds = comp.get("odds") or []
              if not odds:
                  return
              market = odds[0] if isinstance(odds[0], dict) else {}
              home_name = item.get("home") or "Casa"
              away_name = item.get("away") or "Ospiti"
              home_odds = market.get("homeTeamOdds") or {}
              away_odds = market.get("awayTeamOdds") or {}
              favorite = None
              if home_odds.get("favorite") is True:
                  favorite = home_name
              elif away_odds.get("favorite") is True:
                  favorite = away_name
              details = str(market.get("details") or "").strip()
              spread = market.get("spread")
              over_under = market.get("overUnder")
              try:
                  spread = float(spread) if spread is not None else None
              except Exception:
                  spread = None
              try:
                  over_under = float(over_under) if over_under is not None else None
              except Exception:
                  over_under = None

              # Some ESPN soccer boards expose only the favorite and a compact
              # details string (for example "AVL -0.5"). Recover the spread
              # from that string instead of assigning every signal the same 62.
              if spread is None and details:
                  # Only recover a handicap such as -1.5 from details.
                  # Do not mistake a moneyline such as -160 or +155 for a spread.
                  spread_match = re.search(r"([+-]?\d+\.\d+)\s*$", details)
                  if spread_match:
                      try:
                          candidate = float(spread_match.group(1))
                          spread = candidate if abs(candidate) <= 5.0 else None
                      except Exception:
                          spread = None
              if spread is not None and abs(spread) > 20.0:
                  # ESPN soccer can expose the American moneyline in the
                  # generic spread field. Treat large values as moneyline,
                  # never as a handicap.
                  if favorite == home_name:
                      home_odds.setdefault("moneyLine", spread)
                  else:
                      away_odds.setdefault("moneyLine", spread)
                  spread = None
              elif spread is not None and abs(spread) > 5.0:
                  spread = None

              if not favorite and details:
                  parts = details.rsplit(" ", 1)
                  if len(parts) == 2:
                      abbr = parts[0].upper()
                      if abbr == str((comp.get("competitors") or [{}])[0].get("team", {}).get("abbreviation") or "").upper():
                          favorite = home_name
                      elif len(comp.get("competitors") or []) > 1 and abbr == str((comp.get("competitors") or [{}, {}])[1].get("team", {}).get("abbreviation") or "").upper():
                          favorite = away_name
              # When both moneylines are available, trust the actual market
              # prices over ESPN's boolean favorite flag. This prevents an
              # underdog from being presented as the winner signal.
              def implied_probability(value):
                  try:
                      ml = float(value)
                      return ((-ml) / ((-ml) + 100)) if ml < 0 else (100 / (ml + 100))
                  except Exception:
                      return None

              home_ml = home_odds.get("moneyLine")
              away_ml = away_odds.get("moneyLine")
              home_prob = implied_probability(home_ml)
              away_prob = implied_probability(away_ml)
              if home_prob is not None and away_prob is not None:
                  favorite = home_name if home_prob >= away_prob else away_name

              if not favorite:
                  return

              # Soccer odds feeds sometimes expose only "TEAM -160" in
              # details. Recover that American moneyline when the nested
              # moneyLine field is absent.
              if details:
                  ml_match = re.search(r"([+-]?\d+)\s*$", details)
                  if ml_match:
                      try:
                          details_ml = float(ml_match.group(1))
                          if abs(details_ml) >= 20:
                              if favorite == home_name:
                                  home_odds.setdefault("moneyLine", details_ml)
                              else:
                                  away_odds.setdefault("moneyLine", details_ml)
                      except Exception:
                          pass

              # Market-only signal: convert the actual American moneyline
              # into an implied probability and map it to a softer, differentiated
              # confidence index. Do not let many favorites collapse at 87.
              strength = 50
              moneyline = home_odds.get("moneyLine") if favorite == home_name else away_odds.get("moneyLine")
              implied = None
              try:
                  ml = float(moneyline) if moneyline is not None else None
                  if ml is not None:
                      implied = ((-ml) / ((-ml) + 100)) if ml < 0 else (100 / (ml + 100))
                      # Convert market probability to a conservative confidence
                      # index. Weak 50-54% favorites are not presented as recommendations.
                      strength = 50 + int(max(0.0, min(0.40, implied - 0.50)) * 120)
                      if implied >= 0.70:
                          strength += 2
                      if implied >= 0.80:
                          strength += 2
              except Exception:
                  pass
              if spread is not None:
                  strength += min(4, int(abs(spread) * 2))
              strength = max(50, min(92, strength))
              item["proposals"] = ["Winner • " + favorite + " (market signal)"]
              # Keep the fallback conservative: do not manufacture a second
              # goal-line recommendation from the over/under market.
              item["proposalScore"] = strength
              item["preMatchStats"] = []
              if moneyline is not None:
                  item["preMatchStats"].append("Moneyline: " + str(moneyline))
              if spread is not None:
                  item["preMatchStats"].append("Handicap: " + str(spread))
              if over_under is not None:
                  item["preMatchStats"].append("Totale gol: " + str(over_under))
              item["preMatchStats"].append("Segnale mercato pre-match")

          def parse_provider_timestamp(date_value, time_value=None):
              try:
                  raw = str(date_value or "").strip()
                  if not raw:
                      return 0
                  if time_value:
                      raw = raw + "T" + str(time_value).strip()
                  if raw.endswith("Z"):
                      return int(datetime.fromisoformat(raw.replace("Z", "+00:00")).timestamp())
                  # Provider dates without an offset are treated as UTC unless
                  # the provider explicitly documents a local timezone.
                  if "T" in raw and "+" not in raw and raw.count("-") >= 2:
                      return int(datetime.fromisoformat(raw).replace(tzinfo=ZoneInfo("UTC")).timestamp())
                  return int(datetime.fromisoformat(raw).timestamp())
              except Exception:
                  return 0

          def external_record(provider, provider_id, home, away, league, timestamp, status, score_home=None, score_away=None):
              return {
                  "id": -abs(as_int(provider_id) or abs(hash(str(provider_id))) % 100000000),
                  "home": str(home or "Home"),
                  "away": str(away or "Away"),
                  "time": datetime.fromtimestamp(timestamp, TZ).strftime("%H:%M") if timestamp else "--:--",
                  "timestamp": timestamp,
                  "league": str(league or "Football"),
                  "status": status,
                  "live": status == "LIVE",
                  "scoreHome": score_home,
                  "scoreAway": score_away,
                  "homeTeamId": None,
                  "awayTeamId": None,
                  "priority": 1,
                  "stats": {},
                  "proposals": [],
                  "proposalScore": 0,
                  "preMatchStats": ["Fonte: " + provider],
                  "sources": [provider],
              }

          def load_football_data_org():
              token = os.environ.get("FOOTBALL_DATA_TOKEN", "").strip()
              if not token:
                  return []
              url = f"https://api.football-data.org/v4/matches?dateFrom={ISO_DATE}&dateTo={ISO_DATE}"
              try:
                  response = session.get(
                      url,
                      headers={"X-Auth-Token": token, "Accept": "application/json"},
                      timeout=20,
                  )
                  response.raise_for_status()
                  matches = (response.json() or {}).get("matches") or []
                  out = []
                  for match in matches:
                      home = (match.get("homeTeam") or {}).get("name")
                      away = (match.get("awayTeam") or {}).get("name")
                      timestamp = parse_provider_timestamp(match.get("utcDate"))
                      status_raw = str(match.get("status") or "").upper()
                      status = "LIVE" if status_raw in {"IN_PLAY", "PAUSED"} else ("FT" if status_raw == "FINISHED" else "NS")
                      score = match.get("score") or {}
                      full = score.get("fullTime") or {}
                      sh = as_int(full.get("home"))
                      sa = as_int(full.get("away"))
                      out.append(external_record(
                          "football-data.org",
                          match.get("id"),
                          home, away,
                          (match.get("competition") or {}).get("name"),
                          timestamp, status,
                          None if status == "NS" else sh,
                          None if status == "NS" else sa,
                      ))
                  print("football-data.org:", len(out), "matches")
                  return out
              except Exception as exc:
                  print("football-data.org unavailable:", exc)
                  return []

          def load_footballdata_io():
              token = os.environ.get("FOOTBALLDATA_IO_KEY", "").strip()
