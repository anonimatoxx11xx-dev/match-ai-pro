                  return out
              except Exception as exc:
                  print("TheSportsDB unavailable:", exc)
                  return []

          def load_openligadb():
              # OpenLigaDB is a free, unauthenticated German football source.
              # Query the current season and keep only today's fixtures/results.
              season = NOW.year
              out = []
              for shortcut, label in (("bl1", "Bundesliga"), ("bl2", "2. Bundesliga"), ("bl3", "3. Liga")):
                  url = f"https://api.openligadb.de/getmatchdata/{shortcut}/{season}"
                  try:
                      data = get_json(url, 20)
                      for match in data if isinstance(data, list) else []:
                          raw_dt = str(match.get("matchDateTimeUTC") or match.get("matchDateTime") or "")
                          timestamp = parse_provider_timestamp(raw_dt)
                          if timestamp:
                              local_date = datetime.fromtimestamp(timestamp, TZ).date().isoformat()
                              if local_date != ISO_DATE:
                                  continue
                          team1 = match.get("team1") or {}
                          team2 = match.get("team2") or {}
                          finished = bool(match.get("matchIsFinished"))
                          result = None
                          for mr in match.get("matchResults") or []:
                              if str(mr.get("resultTypeID")) == "2":
                                  result = mr
                          sh = as_int((result or {}).get("pointsTeam1"))
                          sa = as_int((result or {}).get("pointsTeam2"))
                          status = "FT" if finished else "NS"
                          out.append(external_record(
                              "OpenLigaDB",
                              match.get("matchID"),
                              team1.get("teamName"),
                              team2.get("teamName"),
                              match.get("leagueName") or label,
                              timestamp,
                              status,
                              None if status == "NS" else sh,
                              None if status == "NS" else sa,
                          ))
                      print("OpenLigaDB", shortcut + ":", len([x for x in out if x.get("league") == label]), "matches")
                  except Exception as exc:
                      print("OpenLigaDB unavailable:", shortcut, exc)
              return out

          def merge_external_sources(records):
              # External providers are used as a second/third opinion and to fill
              # coverage gaps. They never overwrite a verified SofaScore/ESPN
              # match and they never manufacture a prediction by themselves.
              external = []
              with ThreadPoolExecutor(max_workers=3) as pool:
                  futures = [
                      pool.submit(load_thesportsdb),
                      pool.submit(load_openligadb),
                      pool.submit(load_football_data_org),
                      pool.submit(load_footballdata_io),
                  ]
                  for future in as_completed(futures):
                      external.extend(future.result())
              existing = {}
              for item in records:
                  key = (normalize_team_name(item.get("home")), normalize_team_name(item.get("away")))
                  existing[key] = item
                  item.setdefault("sources", [])
                  primary = "SofaScore" if item.get("id", 0) > 0 else "ESPN"
                  if primary not in item["sources"]:
                      item["sources"].append(primary)
              added = 0
              for item in external:
                  key = (normalize_team_name(item.get("home")), normalize_team_name(item.get("away")))
                  if not key[0] or not key[1]:
                      continue
                  current = existing.get(key)
                  if current:
                      current.setdefault("sources", [])
                      for source in item.get("sources") or []:
                          if source not in current["sources"]:
                              current["sources"].append(source)
                      if current.get("status") == "NS" and item.get("status") == "LIVE":
                          current["status"] = "LIVE"
                          current["live"] = True
                      continue
                  records.append(item)
                  existing[key] = item
                  added += 1
              print("Multi-source merge:", len(external), "external matches,", added, "new matches")
              return records

          def load_events():
              urls = [
                  f"https://api.sofascore.app/api/v1/sport/football/scheduled-events/{ISO_DATE}",
                  f"https://www.sofascore.com/api/v1/sport/football/scheduled-events/{ISO_DATE}",
              ]
              last_error = None
              for url in urls:
                  try:
                      data = get_json(url, 25)
                      events = data.get("events") or []
                      if events:
                          return events, url, True
                  except Exception as exc:
                      last_error = exc

              rapid_key = os.environ.get("APP_RAPIDAPI_KEY", "")
              if rapid_key:
                  try:
                      url = f"https://sofascore-api4.p.rapidapi.com/api/v1/schedule/sport/football/{ISO_DATE}"
                      response = session.get(
                          url,
                          headers={
                              "x-rapidapi-key": rapid_key,
                              "x-rapidapi-host": "sofascore-api4.p.rapidapi.com",
                              "Accept": "application/json",
                          },
                          impersonate="chrome",
                          timeout=25,
                      )
                      response.raise_for_status()
                      data = response.json()
                      events = data.get("events") or (data.get("data") or {}).get("events") or []
                      if events:
                          return events, url, True
                      last_error = RuntimeError("RapidAPI SofaScore returned no events")
                  except Exception as exc:
                      last_error = exc

              try:
                  events, espn_url = load_espn_events()
                  print("SofaScore unavailable; using ESPN scoreboard fallback:", len(events), "events")
                  return events, espn_url, False
              except Exception as exc:
                  last_error = exc

              # When today has no selected fixtures, analyze the next available
              # top-competition slate instead of leaving the AI tab empty.
              for days_ahead in (1, 2):
                  target_date = NOW.date() + timedelta(days=days_ahead)
                  try:
                      events, espn_url = load_espn_events(target_date)
                      if events:
                          for event in events:
                              if isinstance(event, dict):
                                  event["_match_ai_future_date"] = True
                          print("No selected matches today; using ESPN upcoming slate:", target_date.isoformat(), len(events), "events")
                          return events, espn_url, False
                  except Exception as exc:
                      last_error = exc
              raise RuntimeError("SofaScore and ESPN scheduled events unavailable: " + str(last_error))

          def stat_num(item, side):
              parsed = as_int(item.get(side + "Value"))
              if parsed is not None:
                  return parsed
              return as_int(item.get(side))

          def stat_pair(items, aliases):
              aliases = {x.lower() for x in aliases}
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  key = str(item.get("key") or "").lower()
                  name = str(item.get("name") or "").lower()
                  if not (key in aliases or name in aliases or any(a in key or a in name for a in aliases)):
                      continue
                  home = stat_num(item, "home")
                  away = stat_num(item, "away")
                  if home is not None and away is not None:
                      return home, away
              return None, None

          def match_stats(event_id):
              try:
                  data = None
                  for stats_url in (
                      "https://api.sofascore.app/api/v1/event/" + str(event_id) + "/statistics",
                      "https://www.sofascore.com/api/v1/event/" + str(event_id) + "/statistics",
                  ):
                      try:
                          data = get_json(stats_url, 18)
                          break
                      except Exception:
                          continue
                  if not data:
                      return {}
                  period = next(
                      (p for p in data.get("statistics", []) if isinstance(p, dict) and p.get("period") == "ALL"),
                      None,
                  )
                  if not period:
                      return {}
                  items = []
                  for group in period.get("groups") or []:
                      items.extend(group.get("statisticsItems") or [])
                  result = {}
                  mapping = [
                      (("homeShots", "awayShots"), {"totalshots", "total shots", "shots"}),
                      (("homeOn", "awayOn"), {"shotsontarget", "shots on target", "shotsongoal"}),
                      (("homeCorners", "awayCorners"), {"cornerkicks", "corner kicks", "corners"}),
                      (("homeFouls", "awayFouls"), {"fouls"}),
                      (("homeThrow", "awayThrow"), {"throwins", "throw-ins", "throw ins"}),
                      (("homeSaves", "awaySaves"), {"goalkeepersaves", "goalkeeper saves", "saves"}),
                  ]
                  for keys, aliases in mapping:
                      home, away = stat_pair(items, aliases)
                      if home is not None and away is not None:
                          result[keys[0]], result[keys[1]] = home, away
                  yh, ya = stat_pair(items, {"yellowcards", "yellow cards"})
                  rh, ra = stat_pair(items, {"redcards", "red cards"})
                  if yh is not None and ya is not None:
                      result["homeCards"] = yh + (rh or 0)
                      result["awayCards"] = ya + (ra or 0)
                  return result
              except Exception:
                  return {}

          def recent(team_id):
              if not team_id:
                  return None
              try:
                  data = None
                  for recent_url in (
                      "https://api.sofascore.app/api/v1/team/" + str(team_id) + "/events/last/0",
                      "https://www.sofascore.com/api/v1/team/" + str(team_id) + "/events/last/0",
                  ):
                      try:
                          data = get_json(recent_url, 15)
                          break
                      except Exception:
                          continue
                  if not data:
                      return None
                  games = 0
                  gf = ga = btts = over15 = over25 = 0
                  for event in data.get("events") or []:
                      live, finished = state(event)
                      if not finished:
                          continue
                      hs = score_value(event.get("homeScore"))
                      aw = score_value(event.get("awayScore"))
                      if hs is None or aw is None:
                          continue
                      home_id = as_int((event.get("homeTeam") or {}).get("id"))
                      if home_id == team_id:
                          scored, conceded = hs, aw
                      else:
                          scored, conceded = aw, hs
                      gf += scored
                      ga += conceded
                      btts += int(hs > 0 and aw > 0)
                      over15 += int(hs + aw >= 2)
                      over25 += int(hs + aw >= 3)
                      games += 1
                      if games >= 5:
                          break
                  if games == 0:
                      return None
                  return {
                      "gf": gf / games,
                      "ga": ga / games,
                      "btts": btts / games,
                      "over15": over15 / games,
                      "over25": over25 / games,
                  }
              except Exception:
                  return None

          def normalize_team_name(value):
              value = str(value or "").lower()
              replacements = {"ä":"a","ö":"o","ü":"u","ß":"ss","é":"e","è":"e","á":"a","à":"a","í":"i","ì":"i","ó":"o","ò":"o","ú":"u","ù":"u"}
              for old, new in replacements.items():
                  value = value.replace(old, new)
              return re.sub(r"[^a-z0-9]", "", value)

          def api_football_get(path, params):
              key = os.environ.get("API_FOOTBALL_KEY", "").strip()
              if not key:
                  return None
              try:
                  response = requests.get(
                      "https://v3.football.api-sports.io" + path,
                      params=params or {},
                      headers={"x-apisports-key": key, "Accept": "application/json"},
                      timeout=18,
                  )
                  response.raise_for_status()
                  payload = response.json()
                  if payload.get("errors"):
                      print("API-Football error:", payload.get("errors"))
                      return None
                  return payload
              except Exception as exc:
                  print("API-Football request failed:", path, exc)
                  return None

          def enrich_with_api_football(records):
              key = os.environ.get("API_FOOTBALL_KEY", "").strip()
              if not key:
                  print("API_FOOTBALL_KEY not configured; pre-match enrichment skipped")
                  return

              candidates = [
                  x for x in records
                  if x.get("status") == "NS" and not x.get("proposals") and (x.get("proposalScore") or 0) <= 0
              ][:20]
              if not candidates:
                  return

              payload = api_football_get(
                  "/fixtures",
                  {"date": ISO_DATE, "timezone": "Europe/Zurich"},
              )
              fixtures = (payload or {}).get("response") or []
              print("API-Football fixtures:", len(fixtures), "candidates:", len(candidates))
              fixture_map = {}
              for fixture in fixtures:
                  teams = fixture.get("teams") or {}
                  home = normalize_team_name((teams.get("home") or {}).get("name"))
                  away = normalize_team_name((teams.get("away") or {}).get("name"))
                  if home and away:
                      fixture_map[(home, away)] = fixture

              def enrich_one(item):
                  key_pair = (normalize_team_name(item.get("home")), normalize_team_name(item.get("away")))
                  fixture = fixture_map.get(key_pair)
                  if not fixture:
                      return item, False
                  fixture_id = ((fixture.get("fixture") or {}).get("id"))
                  if not fixture_id:
                      return item, False
                  prediction = api_football_get("/predictions", {"fixture": fixture_id})
                  row = ((prediction or {}).get("response") or [None])[0]
                  if not isinstance(row, dict):
                      return item, False
                  pred = row.get("predictions") or {}
                  percent = pred.get("percent") or {}
                  winner = pred.get("winner") or {}
                  goals = pred.get("goals") or {}
                  advice = str(pred.get("advice") or "").strip()
                  under_over = str(pred.get("under_over") or "").strip()

                  home_pct = str(percent.get("home") or "").strip()
                  draw_pct = str(percent.get("draw") or "").strip()
                  away_pct = str(percent.get("away") or "").strip()
                  gh = str(goals.get("home") or "").strip()
                  ga = str(goals.get("away") or "").strip()
                  try:
                      if gh and float(gh) < 0:
                          gh = ""
                      if ga and float(ga) < 0:
                          ga = ""
                  except Exception:
                      pass

                  if under_over.startswith("+"):
                      under_over = "Over " + under_over[1:]
                  elif under_over.startswith("-"):
                      under_over = "Under " + under_over[1:]
                  advice = re.sub(r"(?<![A-Za-z])\+([0-9]+(?:\\.[0-9]+)?)\\s+goals", r"Over \\1 goals", advice, flags=re.IGNORECASE)
                  advice = re.sub(r"(?<![A-Za-z])-([0-9]+(?:\\.[0-9]+)?)\\s+goals", r"Under \\1 goals", advice, flags=re.IGNORECASE)

                  proposals_out = []
                  if advice:
                      proposals_out.append(advice)
                  elif winner.get("name"):
                      proposals_out.append("1X • " + str(winner.get("name")))
                  if under_over:
                      proposals_out.append(under_over + " • previsione pre-match")
                  elif gh and ga:
                      try:
                          total = float(gh) + float(ga)
                          proposals_out.append(("Over 1.5" if total >= 1.8 else "Under 3.5") + " • gol attesi " + gh + "–" + ga)
                      except Exception:
                          pass

                  comparison = row.get("comparison") or {}
                  h2h = row.get("h2h") or {}
                  if not proposals_out and comparison:
                      proposals_out.append("1X2 • confronto statistico disponibile")
                  if not proposals_out:
                      return item, False

                  score = 50
                  for value in (home_pct, draw_pct, away_pct):
                      try:
                          score += int(float(value.replace("%", "")) / 20)
                      except Exception:
                          pass
                  item["proposals"] = proposals_out[:3]
                  item["proposalScore"] = max(50, min(88, score))
                  pre = []
                  if home_pct or draw_pct or away_pct:
                      pre.append("1: " + (home_pct or "—") + "  •  X: " + (draw_pct or "—") + "  •  2: " + (away_pct or "—"))
                  if gh or ga:
                      pre.append("Gol attesi: " + (gh or "—") + " – " + (ga or "—"))
                  if under_over:
                      pre.append("Linea gol: " + under_over)
                  item["preMatchStats"] = pre[:3]
                  return item, True

              with ThreadPoolExecutor(max_workers=6) as pool:
                  futures = {pool.submit(enrich_one, item): item for item in candidates}
                  for future in as_completed(futures):
                      item, ok = future.result()
                      if not ok:
                          # -1 marks this match as attempted so the 100/day quota is not burned repeatedly.
                          item["proposalScore"] = -1

          def form_points(items):
              return sum({"W": 3, "D": 1, "L": 0}.get(str(x).upper(), 0) for x in (items or [])[-5:])

          def proposals(record_item, form_data, home_recent, away_recent):
              home_team = (form_data.get("homeTeam") or {}) if isinstance(form_data, dict) else {}
              away_team = (form_data.get("awayTeam") or {}) if isinstance(form_data, dict) else {}
              hp = form_points(home_team.get("form") or [])
              ap = form_points(away_team.get("form") or [])

              items = []
              index = 45

              if hp >= ap + 3:
                  items.append("1X • forma recente favorevole alla squadra di casa")
                  index += 13
              elif ap >= hp + 3:
                  items.append("X2 • forma recente favorevole alla squadra ospite")
                  index += 13
              else:
                  items.append("1X2 equilibrato • nessun vantaggio netto dalla forma")
                  index += 4

              if home_recent and away_recent:
                  index += 8
                  expected = (
                      home_recent["gf"]
                      + away_recent["ga"]
                      + away_recent["gf"]
                      + home_recent["ga"]
                  ) / 2
                  btts = (home_recent["btts"] + away_recent["btts"]) / 2
                  over15 = (home_recent["over15"] + away_recent["over15"]) / 2
                  over25 = (home_recent["over25"] + away_recent["over25"]) / 2

                  if expected >= 2.35 or over15 >= 0.70:
                      items.append("Over 1.5 • ritmo delle ultime 5 gare")
                      index += 9
                  if expected >= 2.90 and over25 >= 0.60:
                      items.append("Over 2.5 • produzione offensiva recente sostenuta")
                      index += 7
                  elif btts >= 0.65:
                      items.append("Goal/Goal • entrambe segnano con frequenza")
                      index += 7
                  elif expected <= 2.15 and over25 <= 0.40:
                      items.append("Under 3.5 • profilo recente contenuto")
                      index += 6

              record_item["proposals"] = items[:3]
              record_item["proposalScore"] = max(45, min(88, index))

          source_live = False
          try:
              events, source_url, source_live = load_events()
              records = []
              seen = set()

              for event in events:
                  if not isinstance(event, dict):
                      continue
                  item = record(event) if source_live else espn_record(event)
                  if item["id"] <= 0 or item["id"] in seen:
                      continue
                  seen.add(item["id"])
                  if not source_live:
                      espn_proposal(item, event)
                  records.append(item)
          except Exception as sofa_error:
              print("SofaScore unavailable, keeping last verified SofaScore feed:", sofa_error)
              try:
                  with open("data/latest.json", "r", encoding="utf-8") as f:
                      cached = json.load(f)
                  records = cached.get("matches") or []
                  source_url = cached.get("sourceUrl") or "https://api.sofascore.com/api/v1"
              except Exception:
                  records = []
                  source_url = "https://api.sofascore.com/api/v1"

          # If both live providers are unavailable and we are serving the cached calendar, never reuse
          # old proposals or confidence scores as if they were fresh analysis.
          # Stale predictions are worse than showing no prediction.
          if not source_live and "espn.com" not in str(source_url):
              print("DEGRADED FEED: clearing cached pre-match proposals until SofaScore is reachable.")
              for cached_item in records:
                  if isinstance(cached_item, dict) and cached_item.get("status") == "NS":
                      cached_item["proposals"] = []
                      cached_item["preMatchStats"] = []
                      cached_item["proposalScore"] = 0

          # Normalize cached records from older feed versions before any keyed access.
          normalized_records = []
          for cached_item in records:
              if not isinstance(cached_item, dict):
                  continue
              cached_item.setdefault("id", 0)
              cached_item.setdefault("home", "Home")
              cached_item.setdefault("away", "Away")
              cached_item.setdefault("time", "--:--")
              cached_item.setdefault("timestamp", 0)
              cached_item.setdefault("league", "Football")
              cached_item.setdefault("status", "NS")
              cached_item.setdefault("live", False)
              cached_item.setdefault("scoreHome", None)
              cached_item.setdefault("scoreAway", None)
              cached_item.setdefault("homeTeamId", None)
              cached_item.setdefault("awayTeamId", None)
              cached_item.setdefault("priority", 0)
              cached_item.setdefault("stats", {})
              cached_item.setdefault("proposals", [])
              cached_item.setdefault("proposalScore", 0)
              cached_item.setdefault("preMatchStats", [])
              # Drop invalid negative goal projections from older feed runs and allow a clean retry.
              if any("Gol attesi:" in str(x) and "-" in str(x).split("Gol attesi:", 1)[1] for x in cached_item.get("preMatchStats") or []):
                  cached_item["preMatchStats"] = [
                      x for x in cached_item.get("preMatchStats") or []
                      if "Gol attesi:" not in str(x)
                  ]
                  cached_item["proposals"] = [
                      x for x in cached_item.get("proposals") or []
                      if "gol attesi" not in str(x).lower()
                  ]
                  cached_item["proposalScore"] = 0
              normalized_records.append(cached_item)
          records = normalized_records

          records = merge_external_sources(records)

          # Hard filter: only show competitions explicitly requested by the user.
          # This prevents fallback providers such as TheSportsDB from injecting
          # unrelated leagues (for example USL) into the daily feed.
          ALLOWED_LEAGUES = {
              "serie a", "serie b",
              "premier league", "championship", "league one", "league two", "national league",
              "la liga", "segunda", "segunda división", "segunda division",
              "ligue 1", "ligue 2",
              "eredivisie", "turkish super lig",
              "bundesliga", "2. bundesliga",
              "uefa champions league", "uefa europa league", "uefa conference league",
              "uefa women's champions league",
              "fa cup", "efl cup", "community shield",
              "copa del rey", "supercopa de españa", "supercopa de espana",
              "german dfb pokal", "coppa italia", "coupe de france",
              "knvb cup", "turkish cup",
              "women's super league", "liga f", "vrouwen eredivisie",
              "frauen-bundesliga", "première ligue", "premiere ligue",
              "serie a femminile",
              "international friendly", "international friendlies",
              "uefa nations league", "fifa world cup qualifying",
              "world cup qualifying - uefa", "world cup qualifying - concacaf",
              "world cup qualifying - conmebol", "world cup qualifying - afc",
              "world cup qualifying - caf", "world cup qualifying - ofc",
              "concacaf nations league", "copa america", "afc asian cup",
              "africa cup of nations", "gold cup"
          }

          def allowed_league(name):
              value = str(name or "").strip().lower()
              if value in ALLOWED_LEAGUES:
                  return True
              # Accept common provider suffixes while remaining strict.
              for suffix in (" women", " men", " - women", " - men"):
                  base = value[:-len(suffix)].strip() if value.endswith(suffix) else value
                  if base in ALLOWED_LEAGUES:
                      return True
              return False

          before_filter = len(records)
          records = [x for x in records if allowed_league(x.get("league"))]
          print("Competition filter:", before_filter, "->", len(records), "matches")

          # Keyless ESPN historical scoreboards provide an independent evidence
          # family for form, so the app can distinguish statistical analysis from
          # a single market quote.
          enrich_with_espn_form(records)

          records.sort(
              key=lambda x: (
                  not x.get("live", False),
                  -(x.get("priority") or 0),
                  x.get("timestamp") or 0,
                  x.get("home") or "",
              )
          )
          records = records[:150]

          candidates = [x for x in records if x["live"] or x["status"] == "FT"][:60]
          with ThreadPoolExecutor(max_workers=10) as pool:
              futures = {pool.submit(match_stats, x["id"]): x for x in candidates}
              for future in as_completed(futures):
                  futures[future]["stats"] = future.result()

          upcoming = [
              x for x in records
              if x["status"] == "NS" and x["homeTeamId"] and x["awayTeamId"]
          ][:25]

          forms = {}
          with ThreadPoolExecutor(max_workers=8) as pool:
              def get_form(item):
                  for form_url in (
                      "https://api.sofascore.app/api/v1/event/" + str(item["id"]) + "/pregame-form",
                      "https://www.sofascore.com/api/v1/event/" + str(item["id"]) + "/pregame-form",
                  ):
                      try:
                          return get_json(form_url, 12)
                      except Exception:
                          continue
                  return {}
              futures = {pool.submit(get_form, x): x for x in upcoming}
              for future in as_completed(futures):
                  forms[futures[future]["id"]] = future.result()

          team_ids = []
          for item in upcoming:
              for team_id in (item["homeTeamId"], item["awayTeamId"]):
                  if team_id and team_id not in team_ids:
                      team_ids.append(team_id)

          recent_map = {}
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = {pool.submit(recent, team_id): team_id for team_id in team_ids[:50]}
              for future in as_completed(futures):
                  recent_map[futures[future]] = future.result()

          for item in upcoming:
              form_data = forms.get(item["id"], {})
              home_recent = recent_map.get(item["homeTeamId"])
              away_recent = recent_map.get(item["awayTeamId"])
              if form_data or home_recent or away_recent:
                  proposals(item, form_data, home_recent, away_recent)

          # When the SofaScore runner is blocked and we are using the verified cache,
          # use API-Football only for pre-match enrichment. The result is persisted in
          # latest.json, so subsequent 15-minute runs do not repeatedly spend quota.
          enrich_with_api_football(records)

          def load_upcoming_calendar(days_ahead=14):
              """Fetch a separate fixture calendar for the selected competitions."""
              calendar_events = []
              for offset in range(0, days_ahead + 1):
                  day = NOW.date().fromordinal(NOW.date().toordinal() + offset)
                  date_key = day.strftime("%Y%m%d")
                  for league_id, league_name in TOP_ESPN_LEAGUES:
                      url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/{league_id}/scoreboard?dates={date_key}&limit=1000"
                      try:
                          payload = get_json(url, 20)
                          for event in payload.get("events") or []:
                              item = espn_record(event)
                              if item.get("id", 0) <= 0:
                                  continue
                              # The league slug is the authoritative competition name
                              # for curated ESPN endpoints; event payloads may say only "Football".
                              item["league"] = league_name
                              local_date = datetime.fromtimestamp(item.get("timestamp") or 0, TZ).date().isoformat() if item.get("timestamp") else day.isoformat()
                              item["time"] = local_date + "|" + str(item.get("time") or "--:--")
                              item["proposalScore"] = 0
                              item["proposals"] = []
                              item["preMatchStats"] = []
                              item["stats"] = {}
                              item["sources"] = sorted(set(item.get("sources") or []) | {"ESPN calendar"})
                              calendar_events.append(item)
                      except Exception:
                          continue

                  # Global ESPN endpoint catches UEFA/international competitions
                  # whose provider league IDs are not always exposed individually.
                  try:
                      url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates={date_key}&limit=1000"
                      payload = get_json(url, 20)
                      for event in payload.get("events") or []:
                          comp = ((event.get("competitions") or [{}])[0]).get("competitor") or []
                          item = espn_record(event)
                          league = str(item.get("league") or "").strip().lower()
                          if item.get("id", 0) > 0 and allowed_league(league):
                              ts = item.get("timestamp") or 0
                              local_date = datetime.fromtimestamp(ts, TZ).date().isoformat() if ts else day.isoformat()
                              item["time"] = local_date + "|" + str(item.get("time") or "--:--")
                              item["proposalScore"] = 0
                              item["proposals"] = []
                              item["preMatchStats"] = []
                              item["stats"] = {}
                              item["sources"] = sorted(set(item.get("sources") or []) | {"ESPN calendar"})
                              calendar_events.append(item)
                  except Exception:
                      pass

              unique = {}
              for item in calendar_events:
                  key = (
                      normalize_team_name(item.get("home")),
                      normalize_team_name(item.get("away")),
                      item.get("timestamp") or 0,
                  )
                  if key[0] and key[1]:
                      unique[key] = item
              result = list(unique.values())
              result.sort(key=lambda x: x.get("timestamp") or 0)
              print("Calendar ready:", len(result), "fixtures")
              return result

          output = {
              "source": "SofaScore + multi-source" if source_live else "ESPN + multi-source fallback",
              "sourceUrl": source_url,
              "sources": sorted({
                  source
                  for match in records
                  for source in (match.get("sources") or [])
              } | ({"SofaScore"} if source_live else {"ESPN"})),
              "date": ISO_DATE,
              "updatedAt": datetime.now(TZ).isoformat(),
              "feedStatus": "LIVE" if source_live else "DEGRADED",
              "matches": records,
          }

          import os
          os.makedirs("data", exist_ok=True)
          calendar = load_upcoming_calendar(14)

          output = {
              "source": "ESPN + multi-source calendar",
              "windowDays": 14,
              "sourceUrl": "https://site.api.espn.com/apis/site/v2/sports/soccer/",
              "updatedAt": datetime.now(TZ).isoformat(),
              "date": ISO_DATE,
              "matches": calendar,
          }
          with open("data/calendar.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, separators=(",", ":"))

          output = {
              "source": "SofaScore + multi-source" if source_live else "ESPN + multi-source fallback",
              "sourceUrl": source_url,
              "sources": sorted({
                  source
                  for match in records
                  for source in (match.get("sources") or [])
              } | ({"SofaScore"} if source_live else {"ESPN"})),
              "date": ISO_DATE,
              "updatedAt": datetime.now(TZ).isoformat(),
              "feedStatus": "LIVE" if source_live else "DEGRADED",
              "matches": records,
          }

          for path in (
              "data/" + ISO_DATE + ".json",
              "data/latest.json",
              "data/today.json",
          ):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(output, f, ensure_ascii=False, separators=(",", ":"))

          print(
              "Feed ready: "
              + str(len(records))
              + " matches, stats="
              + str(sum(bool(x.get("stats")) for x in records))
              + ", proposals="
              + str(sum(bool(x.get("proposals")) for x in records))
              + ", sources=" + ", ".join(sorted({
                  source
                  for match in records
                  for source in (match.get("sources") or [])
              } | ({"SofaScore"} if source_live else {"ESPN"})))
          )
          PY

      - name: Publish feed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save the freshly generated feed before syncing with main. The build
          # and feed workflows can run at the same time, so rebasing a commit
          # that contains data/*.json is prone to conflicts.
          rm -rf /tmp/match-ai-feed
          mkdir -p /tmp/match-ai-feed
          cp data/*.json /tmp/match-ai-feed/

          for attempt in 1 2 3; do
            echo "Publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/match-ai-feed/*.json data/
            git add data/

            if git diff --cached --quiet; then
              echo "No feed changes."
              exit 0
            fi

            git commit -m "data: update football feed"

            if git push origin HEAD:main; then
              echo "Feed published successfully."
              exit 0
            fi

            echo "Push raced with another main update; retrying."
            git reset --hard origin/main
          done

          echo "Unable to publish feed after 3 attempts."
          exit 1
